name: エルメス新商品チェック

on:
  schedule:
    # UTC基準。 */5 は5分おきの意味です（公開リポジトリのためActions無料枠は無制限）。
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
    # ↑ これがあると「Actions」タブから手動でも実行できます（テスト用）

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッケージキャッシュを復元（2回目以降を高速化）
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/puppeteer
          key: npm-puppeteer-${{ hashFiles('package.json') }}

      - name: 必要なパッケージをインストール（Puppeteer含む）
        run: npm install

      - name: 新商品をチェックしてLINEに通知
        run: node index.js
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

      - name: 確認履歴(state.json)を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "商品確認履歴を更新"
          git push
